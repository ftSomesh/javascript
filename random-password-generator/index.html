<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <h1>Generate a<br><span>random password</span></h1>
        <div class="display">
            <input type="text" id="password" placeholder="password">
            <svg onclick="copyText()" id="clipboard" xmlns="http://www.w3.org/2000/svg" height="auto"
                viewBox="0 -960 960 960" width="30px" fill="green">
                <path
                    d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z" />
            </svg>
        </div>
        <button onclick="showPassword()"><svg id="bolt" xmlns="http://www.w3.org/2000/svg" height="auto"
                viewBox="0 -960 960 960" width="28px" fill="#e3e3e3">
                <path
                    d="m422-232 207-248H469l29-227-185 267h139l-30 208ZM320-80l40-280H160l360-520h80l-40 320h240L400-80h-80Zm151-390Z" />
            </svg> Generate Password</button>
    </div>
    <script src="./script.js"></script>
</body>

</html>
